name: Auto Deploy to Linux Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to the deployment folder
            cd /home/mo/live-sport-plugin
            
            # 2. Pull the latest code
            git fetch origin
            git reset --hard origin/main
            
            # 3. Install new dependencies
            bun install
            
            # 4. Build the project
            bun run build
            
            # 5. Restart the systemd service
            sudo systemctl restart nuvio.service
            
            # 6. Verify that the service started successfully
            sleep 2
            if sudo systemctl is-active --quiet nuvio.service; then
              echo "✅ Nuvio service restarted successfully and is active!"
            else
              echo "❌ ERROR: Nuvio service failed to start."
              sudo systemctl status nuvio.service --no-pager
              exit 1
            fi
